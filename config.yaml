hotkey: [cmd_r, alt_r]   # right command + right option
mode: hold      # hold or toggle
model: small
language:           # set "zh" or "en"
simplified: true  # convert Traditional Chinese output to Simplified Chinese
task: transcribe  # transcribe or translate
temperature: 0.0  # 0.0 = deterministic; try 0.2–0.4 for more natural speech

# Optional: seed text to improve accuracy for names, jargon, domain vocabulary.
# Example: prompt: "Chenghao, WhisperKit, CoreML, argmax-cli"
prompt:

# Input device index for the microphone.
# Leave blank (null) to use the system default.
# Run: python3 -c "import sounddevice as sd; [print(i, d['name']) for i,d in enumerate(sd.query_devices()) if d['max_input_channels']>0]"
# to list available devices, then set the index here.
device:         # leave blank to use system default microphone

debug_audio: false  # set true to save each recording to /tmp/wd-debug-NNN.wav

server:
  host: localhost
  port: 50060

# Local Ollama LLM cleanup: removes filler words (uh, um, ah, eh, hmm) and resolves
# mid-sentence corrections. Requires Ollama running with the model pulled locally.
# Install Ollama: https://ollama.com — then run: ollama pull llama3.2
cleanup:
  enabled: false
  model: llama3.2
  host: localhost
  port: 11434
